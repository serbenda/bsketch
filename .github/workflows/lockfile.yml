# Makes desktop/package-lock.json for the Tauri CLI when desktop/package.json changes, and leaves it as an
# artifact ("desktop-lockfile") to commit. It runs here because the npm registry may not be reachable from
# the maintainer's machine. Nothing is installed or run: only the lockfile is resolved.
name: Lockfile

on:
  push:
    branches: [development]
    paths: ['desktop/package.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Desktop lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: lts/*
      - name: Resolve the lockfile
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: desktop-lockfile
          path: desktop/package-lock.json
          retention-days: 7
