name: 🐞 Bug
description: Something doesn't work as it should
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: Describe the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce it
      placeholder: |
        1. Go to...
        2. Click...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "E.g.: Chrome 130 on Android"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or console errors
